[project]
name = "socrates"
version = "0.5.6"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "aiolimiter>=1.3.0",
    "asyncpg>=0.31.0",
    "maxapi>=1.2.2",
    "pillow>=12.3.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "yarl>=1.25.1",
]

[tool.ruff]
builtins = ["_"]
fix = true
line-length = 128
src = ["bot"]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
lines-between-types = 1
